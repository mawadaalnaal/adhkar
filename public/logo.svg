  <!-- Inner decorative circle -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5"/>
  
  <!-- Mosque dome shape -->
  <path d="M32 14 C28 14 24 18 24 22 L24 32 C24 34 26 36 28 36 L36 36 C38 36 40 34 40 32 L40 22 C40 18 36 14 32 14Z" fill="#d4af37"/>
  
  <!-- Dome highlight -->
  <path d="M28 16 C30 16 32 14 32 14 C32 14 34 16 36 16" stroke="#fff" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  
  <!-- Minaret left -->
  <rect x="16" y="24" width="4" height="16" rx="1" fill="#d4af37"/>
  <rect x="15" y="22" width="6" height="3" rx="1" fill="#d4af37"/>
  <path d="M18 22 L18 20 L20 18 L18 20 L22 20" stroke="#d4af37" stroke-width="1" fill="none"/>
  
  <!-- Minaret right -->
  <rect x="44" y="24" width="4" height="16" rx="1" fill="#d4af37"/>
  <rect x="43" y="22" width="6" height="3" rx="1" fill="#d4af37"/>
  <path d="M46 22 L46 20 L48 18 L46 20 L50 20" stroke="#d4af37" stroke-width="1" fill="none"/>
  
  <!-- Crescent moon -->
  <path d="M32 42 C34 42 36 44 36 46 C36 48 34 50 32 50 C30 50 28 48 28 46 C28 44 30 42 32 42Z" fill="#d4af37"/>
  <circle cx="34" cy="44" r="1.5" fill="#1a5f4a"/>
  
  <!-- Star -->
  <polygon points="32,46 33,48 35,48 33.5,49.5 34,52 32,50.5 30,52 30.5,49.5 29,48 31,48" fill="#d4af37"/>
  
  <!-- Decorative text-like elements (Tashkeel) -->
  <circle cx="26" cy="28" r="1" fill="#1a5f4a"/>
  <circle cx="38" cy="28" r="1" fill="#1a5f4a"/>
  <circle cx="32" cy="30" r="1" fill="#1a5f4a"/>
</svg>
